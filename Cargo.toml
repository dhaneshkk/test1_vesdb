[workspace]
resolver = "2"
members = [
    "crates/vesdb-core",
    "crates/vesdb-store",
    "crates/vesdb-server",
    "crates/vesdb-witness",
    "crates/vesdb-verify",
    "crates/vesdb-eventql",
    "crates/vesdb-ts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/dhaneshkk/vesdb"

[workspace.dependencies]
vesdb-core = { path = "crates/vesdb-core" }
vesdb-store = { path = "crates/vesdb-store" }
vesdb-witness = { path = "crates/vesdb-witness" }
vesdb-ts = { path = "crates/vesdb-ts" }
sha2 = "0.11"
ed25519-dalek = "3"
ml-dsa = "0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
hex = "0.4"
thiserror = "2"
crc32c = "0.6"
getrandom = "0.3"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2

# the codec and chunk paths are hot; keep debug builds representative
[profile.dev.package.vesdb-ts]
opt-level = 2
